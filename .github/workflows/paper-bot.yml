name: pump-paper-bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"     # backup: agar chain toot jaaye

concurrency:
  group: paper-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install websockets requests
      - name: Git setup
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
      - name: Bot chalao (~5.7 ghante, har 30 min save)
        env:
          RUN_HOURS: "5.7"
          AUTO_COMMIT: "1"
        run: python pump_paper_test.py
      - name: Result save karo
        if: always()
        run: |
          git add -A
          git commit -m "paper bot update $(date -u +%F_%H:%M)" || echo "kuch naya nahi"
          git pull --rebase || true
          git push
      - name: Agla run start karo (bina ruke chalta rahe)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run paper-bot.yml --ref main
